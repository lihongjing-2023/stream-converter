[package]
name = "stream-converter"
version = "0.1.0"
edition = "2021"
description = "High-performance OpenAI-compatible stream/non-stream format converter proxy"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["stream", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3"
tokio-stream = "0.1"
bytes = "1"
url = "2"
blake3 = "1.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
